user nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    resolver 127.0.0.11;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Add font MIME types
    types {
        application/x-font-ttf           ttf;
        application/x-font-opentype      otf;
        application/font-woff            woff;
        application/font-woff2           woff2;
    }

    # Update CORS map for your actual domain
    map $http_origin $cors_header {
        default "";
        "https://rwtchoir.org" "$http_origin";
        "https://www.rwtchoir.org" "$http_origin";
        "http://66.245.195.86" "$http_origin";
        "~^http://localhost:3000$" "$http_origin";
    }

    sendfile        on;
    keepalive_timeout  65;

    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    # Timeouts
    proxy_connect_timeout 60;
    proxy_send_timeout 60;
    proxy_read_timeout 60;
    send_timeout 60;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name rwtchoir.org www.rwtchoir.org;
        
        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name rwtchoir.org www.rwtchoir.org;

        # Updated SSL configuration for .cer file
        ssl_certificate /etc/nginx/ssl/rwtchoir_org.crt;  # Your .cer file
        ssl_certificate_key /etc/nginx/ssl/private.key;   # Your private key from IONOS
        
        # Remove this line if you don't have a chain file
        # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # Improved SSL settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_buffer_size 4k;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        
        # Enable HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Global CORS settings
        add_header 'Access-Control-Allow-Origin' $cors_header always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;

        # API proxy with fixed routing
        location /api/ {
            error_log /var/log/nginx/api_error.log debug;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            # Handle OPTIONS
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Serve font files directly
        location /fonts/ {
            add_header 'Access-Control-Allow-Origin' $cors_header;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri $uri/ =404;
        }

        # Proxy requests to /images to the API server (CRUCIAL!)
        location /images/ {
            proxy_pass http://api:8080/images/; # Trailing slash is essential!
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy requests to /images to the API server (CRUCIAL!)
        location /music/ {
            proxy_pass http://api:8080/music/; # Trailing slash is essential!
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

          # Serve static files (Crucial!)
        location /static {
            expires max;
            add_header Cache-Control public;
        }


        # React app routing
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}